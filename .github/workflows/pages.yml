# docs/ を GitHub Pages へ公開する。
#
# サイトの生成は GitHub が提供する Jekyll をそのまま使う。リポジトリ側に生成器の依存
# (Gemfile 等) を持たないため。したがって生成器の版は固定できないが、対象は文書のみで
# あり、環境の再現性には関わらない。
#
# 依存する外部 action はコミット SHA で固定する。タグは再割り当てが可能であり、
# 固定にはならない。
name: Pages

on:
  push:
    branches: [main]
  # サイトが生成できることを PR の時点で確認する。配置は行わない。main への push
  # まで検証が無いと、生成の失敗が公開の直前に現れる。
  pull_request:
    paths:
      - docs/**
      - .github/workflows/pages.yml
  # 内容を変えずに再公開したい場合に使う。
  workflow_dispatch:

# workflow 全体では文書の読み取りだけを許可する。Pages への書き込みと OIDC は、
# main を配置する deploy job にだけ与える。
permissions:
  contents: read

# 配置は同時に 1 つとする。実行中のものは打ち切らない。打ち切ると公開されている内容が
# 中途半端な状態で残りうるため。ref ごとに分けているのは、PR の生成確認が main の
# 配置を待たせないようにするためである。配置を行う ref は main のみであり、
# 配置どうしは従来どおり直列となる。
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: サイトを生成する
        # actions/jekyll-build-pages v1
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./docs
          destination: ./_site

      - name: 成果物を登録する
        if: github.event_name != 'pull_request'
        # actions/upload-pages-artifact v3
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./_site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages の設定を取得する
        # actions/configure-pages v5
        #
        # 引数は与えない。static_site_generator と generator_config_file による
        # baseurl の注入は、当該 action が .js / .cjs / .mjs しか扱えないため
        # Jekyll の _config.yml には使えない。baseurl は docs/_config.yml に書く。
        #
        # Pages が有効化されていない場合は、書き込み権限を持つ deploy job で明確に
        # 失敗させる。PR の build job は Pages API へアクセスしない。
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: 配置する
        id: deployment
        # actions/deploy-pages v4
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
