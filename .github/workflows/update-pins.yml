# 固定した参照を更新し、PR を作成する。手動実行のみ。
#
# 更新は意図的な操作であるため、定期実行はしない。値は実行時に与える。取得方法は
# `make bump-help` (scripts/update-pins.sh --help) に示す。
#
# 検査は CI と同様にコンテナ内で実行する。ランナーへ Nix を導入すると、CI 環境が
# ホストおよびコンテナと別の環境になるため。
#
# PR の作成には外部 action を使用せず、ランナー同梱の gh と GITHUB_TOKEN を用いる。
# 外部 action を増やさないため。
#
# 注意: GITHUB_TOKEN で作成した PR では他のワークフローが起動しない (GitHub の仕様)。
# そのため本ワークフローの中で make check まで実行し、その結果を PR に記載する。
name: Update pins

on:
  workflow_dispatch:
    inputs:
      target:
        description: 更新する対象
        required: true
        type: choice
        options:
          - nixpkgs
          - home-manager
          - image
          - action
          - nix-installer
      value:
        description: "1 つ目の値 (rev / バージョン / owner/repo)"
        required: true
        type: string
      value2:
        description: "2 つ目の値 (ダイジェスト / sha256 / コミット SHA。不要な対象では空)"
        required: false
        default: ""
        type: string

# 同時に複数の更新を走らせない。同一ファイルを書き換えるため。
concurrency:
  group: update-pins
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: 値を書き換える
        env:
          TARGET: ${{ inputs.target }}
          VALUE: ${{ inputs.value }}
          VALUE2: ${{ inputs.value2 }}
        run: |
          set -euo pipefail
          if [ -n "$VALUE2" ]; then
            scripts/update-pins.sh "$TARGET" "$VALUE" "$VALUE2"
          else
            scripts/update-pins.sh "$TARGET" "$VALUE"
          fi

      # flake.nix を変更した場合は flake.lock を再生成する。イメージを構築する前に
      # 行う必要がある。構築時点で両者が整合していないと、nix が暗黙に再ロックする。
      #
      # ここで使う nix は、Dockerfile が固定しているベースイメージから取る。
      # ワークフローに版を書くと Dockerfile と二重管理になるため。
      - name: flake.lock を再生成する
        if: inputs.target == 'nixpkgs' || inputs.target == 'home-manager'
        run: |
          set -euo pipefail
          version=$(grep -oE '^ARG NIX_VERSION=[^[:space:]]+' Dockerfile | head -1 | cut -d= -f2)
          digest=$(grep -oE '^ARG NIX_IMAGE_DIGEST=[^[:space:]]+' Dockerfile | head -1 | cut -d= -f2)
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            "nixos/nix:${version}@${digest}" \
            nix --extra-experimental-features 'nix-command flakes' flake update
          sudo chown "$(id -u):$(id -g)" flake.lock

      - name: イメージを構築する
        run: docker build -t dotfiles-dev .

      - name: コンテナ内で検査を実行する
        # CI と同一のコマンド。--network none で自己完結性も同時に検証する。
        run: docker run --rm --network none dotfiles-dev make check

      - name: 変更を確認する
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "エラー: 変更がありません。既に同じ値が設定されている可能性があります。" >&2
            exit 1
          fi
          git diff --stat

      - name: PR を作成する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ inputs.target }}
          VALUE: ${{ inputs.value }}
          VALUE2: ${{ inputs.value2 }}
        run: |
          set -euo pipefail

          branch="update-pins/${TARGET}-${GITHUB_RUN_ID}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          summary="$VALUE"
          if [ -n "$VALUE2" ]; then
            summary="$VALUE $VALUE2"
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add -A
          git commit \
            -m "chore: ${TARGET} の固定を更新する" \
            -m "対象: ${TARGET}" \
            -m "値: ${summary}" \
            -m "Update pins ワークフロー (run ${GITHUB_RUN_ID}) による更新。コンテナ内で make check が成功したことを確認済み。"
          git push -u origin "$branch"

          # PR 本文はファイルに組み立てる。YAML のブロックスカラー内では、行頭に
          # インデントの無い行を置けないため (ヒアドキュメントは使えない)。
          {
            printf '## 概要\n\n'
            printf '`Update pins` ワークフロー ([run %s](%s)) による固定の更新。\n\n' \
              "$GITHUB_RUN_ID" "$run_url"
            printf '| 項目 | 値 |\n'
            printf '| --- | --- |\n'
            printf '| 対象 | `%s` |\n' "$TARGET"
            printf '| 与えた値 | `%s` |\n\n' "$summary"
            printf '## 検証\n\n'
            printf 'ワークフロー内で、CI と同一の経路 (イメージを構築し `--network none` の\n'
            printf 'コンテナ内) で検査済み。\n\n'
            printf -- '- `docker build` → 完走\n'
            printf -- '- `docker run --rm --network none dotfiles-dev make check` → 成功\n\n'
            printf '`GITHUB_TOKEN` で作成した PR では他のワークフローが起動しない (GitHub の\n'
            printf '仕様)。この PR に CI のチェックは付かないため、上記がその代替である。\n\n'
            printf -- '---\n'
            printf '_Generated by [Claude Code](https://claude.ai/code)_\n'
          } >"${RUNNER_TEMP}/pr-body.md"

          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$branch" \
            --title "chore: ${TARGET} の固定を更新する" \
            --body-file "${RUNNER_TEMP}/pr-body.md"
